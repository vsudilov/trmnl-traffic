name: Render TRMNL traffic map

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render image
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}   # if using --provider tomtom
        run: python render.py --device x --lat 42.3298938 --lon -71.097972 --zoom 14 --out site/boston-traffic.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes can't see the artifact that was uploaded a moment
      # earlier ("Found 0 artifact(s)" / "Fetching artifact metadata failed").
      # That's on GitHub's side and clears up after a short wait, so retry once.
      - id: deploy_first
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy_first.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
